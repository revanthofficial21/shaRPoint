[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for any route the filesystem doesn't have, so
# deep links and the Supabase auth callback (/auth/callback) work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
