<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <!--
    Hero backdrop for the landing page.

    WHY THIS FILE EXISTS
    LandingPage.css pointed .sp-hero-art at /avatars/campus-student-hero.png, and
    that file was never added to the repository. The hero therefore rendered as a
    flat dark rectangle — a silent 404 that no type check, lint rule or build step
    catches. This is a real asset at a real path.

    To use a photograph instead: drop it at public/avatars/campus-student-hero.jpg
    and change the url() in LandingPage.css. The shade overlay above it is already
    tuned for a busy image, so nothing else needs to move.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03102b"/>
      <stop offset="45%" stop-color="#071a3f"/>
      <stop offset="100%" stop-color="#0b2450"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="90%" r="65%">
      <stop offset="0%" stop-color="#4a54ff" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#7c5cff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051230"/>
      <stop offset="100%" stop-color="#02080f"/>
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="70" r="1.6" opacity=".35"/><circle cx="310" cy="42" r="1.2" opacity=".22"/>
    <circle cx="470" cy="120" r="1.8" opacity=".3"/><circle cx="640" cy="66" r="1.3" opacity=".2"/>
    <circle cx="820" cy="104" r="1.5" opacity=".28"/><circle cx="990" cy="52" r="1.2" opacity=".18"/>
    <circle cx="1150" cy="96" r="1.7" opacity=".3"/><circle cx="1330" cy="60" r="1.3" opacity=".2"/>
    <circle cx="1480" cy="118" r="1.5" opacity=".26"/><circle cx="220" cy="180" r="1.2" opacity=".16"/>
    <circle cx="760" cy="188" r="1.3" opacity=".16"/><circle cx="1260" cy="170" r="1.2" opacity=".15"/>
  </g>

  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant skyline, softened so it reads as depth rather than detail -->
  <g filter="url(#soften)" opacity=".55" fill="#0a1c42">
    <rect x="180" y="430" width="150" height="330"/>
    <rect x="400" y="360" width="190" height="400"/>
    <rect x="660" y="470" width="140" height="290"/>
    <rect x="880" y="400" width="170" height="360"/>
    <rect x="1120" y="450" width="210" height="310"/>
  </g>

  <!-- campus buildings with lit windows -->
  <g>
    <rect x="-40" y="470" width="190" height="430" fill="#061633"/>
    <rect x="170" y="560" width="130" height="340" fill="#061633"/>
    <rect x="320" y="380" width="230" height="520" fill="#071a3c"/>
    <rect x="570" y="520" width="150" height="380" fill="#061633"/>
    <rect x="740" y="440" width="210" height="460" fill="#071a3c"/>
    <rect x="970" y="600" width="140" height="300" fill="#061633"/>
    <rect x="1130" y="360" width="250" height="540" fill="#071a3c"/>
    <rect x="1400" y="500" width="180" height="400" fill="#061633"/>
  </g>

  <g>
    <rect x="320" y="380" width="230" height="3" fill="#4a54ff" opacity=".45"/>
    <rect x="1130" y="360" width="250" height="3" fill="#4a54ff" opacity=".45"/>
    <rect x="740" y="440" width="210" height="3" fill="#4a54ff" opacity=".35"/>
  </g>

  <!-- windows: deterministic, roughly a third lit -->
  <g>
    <g fill="#f2b544">
      <rect x="336" y="404" width="18" height="12" rx="2" opacity=".55"/><rect x="404" y="404" width="18" height="12" rx="2" opacity=".4"/>
      <rect x="472" y="404" width="18" height="12" rx="2" opacity=".5"/><rect x="370" y="440" width="18" height="12" rx="2" opacity=".45"/>
      <rect x="506" y="440" width="18" height="12" rx="2" opacity=".38"/><rect x="336" y="512" width="18" height="12" rx="2" opacity=".42"/>
      <rect x="438" y="548" width="18" height="12" rx="2" opacity=".5"/><rect x="472" y="620" width="18" height="12" rx="2" opacity=".36"/>
      <rect x="1146" y="384" width="18" height="12" rx="2" opacity=".55"/><rect x="1214" y="384" width="18" height="12" rx="2" opacity=".4"/>
      <rect x="1350" y="420" width="18" height="12" rx="2" opacity=".48"/><rect x="1282" y="456" width="18" height="12" rx="2" opacity=".36"/>
      <rect x="756" y="464" width="18" height="12" rx="2" opacity=".5"/><rect x="892" y="500" width="18" height="12" rx="2" opacity=".4"/>
      <rect x="824" y="572" width="18" height="12" rx="2" opacity=".34"/><rect x="188" y="584" width="18" height="12" rx="2" opacity=".4"/>
      <rect x="986" y="624" width="18" height="12" rx="2" opacity=".38"/><rect x="1416" y="524" width="18" height="12" rx="2" opacity=".44"/>
    </g>
    <g fill="#5cc8f5">
      <rect x="370" y="404" width="18" height="12" rx="2" opacity=".4"/><rect x="438" y="404" width="18" height="12" rx="2" opacity=".3"/>
      <rect x="506" y="404" width="18" height="12" rx="2" opacity=".34"/><rect x="336" y="440" width="18" height="12" rx="2" opacity=".3"/>
      <rect x="438" y="476" width="18" height="12" rx="2" opacity=".36"/><rect x="404" y="512" width="18" height="12" rx="2" opacity=".28"/>
      <rect x="1146" y="420" width="18" height="12" rx="2" opacity=".34"/><rect x="1282" y="384" width="18" height="12" rx="2" opacity=".3"/>
      <rect x="1214" y="492" width="18" height="12" rx="2" opacity=".36"/><rect x="1350" y="528" width="18" height="12" rx="2" opacity=".3"/>
      <rect x="756" y="500" width="18" height="12" rx="2" opacity=".34"/><rect x="824" y="536" width="18" height="12" rx="2" opacity=".3"/>
      <rect x="892" y="608" width="18" height="12" rx="2" opacity=".32"/><rect x="588" y="544" width="18" height="12" rx="2" opacity=".3"/>
      <rect x="986" y="660" width="18" height="12" rx="2" opacity=".3"/><rect x="1416" y="560" width="18" height="12" rx="2" opacity=".34"/>
    </g>
  </g>

  <!-- treeline -->
  <g fill="#04122c">
    <rect x="115" y="760" width="10" height="90"/><circle cx="120" cy="730" r="60"/>
    <rect x="295" y="760" width="10" height="90"/><circle cx="300" cy="716" r="78"/>
    <rect x="515" y="760" width="10" height="90"/><circle cx="520" cy="742" r="52"/>
    <rect x="695" y="760" width="10" height="90"/><circle cx="700" cy="724" r="70"/>
    <rect x="895" y="760" width="10" height="90"/><circle cx="900" cy="736" r="58"/>
    <rect x="1075" y="760" width="10" height="90"/><circle cx="1080" cy="720" r="74"/>
    <rect x="1285" y="760" width="10" height="90"/><circle cx="1290" cy="738" r="56"/>
    <rect x="1475" y="760" width="10" height="90"/><circle cx="1480" cy="726" r="68"/>
  </g>

  <rect x="0" y="840" width="1600" height="60" fill="url(#ground)"/>
</svg>
