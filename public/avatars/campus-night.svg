<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <!--
    Hero backdrop for the landing page.

    WHY THIS FILE EXISTS
    LandingPage.css pointed .sp-hero-art at /avatars/campus-student-hero.png, and
    that file was never added to the repository. The hero therefore rendered as a
    flat dark rectangle — a silent 404 that no type check, lint rule or build step
    catches. This is a real asset at a real path, and a test guards the reference.

    The first version of this file was far too dim: the buildings sat at 8-10%
    lightness against a 9% canvas, so the whole scene read as one flat navy
    rectangle. This version lifts the architecture, brightens the windows and adds
    a lit walkway, which is what gives the hero depth behind the illustration.

    To use a photograph instead: drop it in public/avatars/ and change the url()
    in LandingPage.css. The shade overlay is already tuned for a busy image.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020b24"/>
      <stop offset="38%" stop-color="#061434"/>
      <stop offset="72%" stop-color="#0a2050"/>
      <stop offset="100%" stop-color="#123069"/>
    </linearGradient>

    <!-- the blue-violet light a lit campus throws into the sky -->
    <radialGradient id="glow" cx="52%" cy="82%" r="62%">
      <stop offset="0%" stop-color="#3b6bff" stop-opacity="0.46"/>
      <stop offset="45%" stop-color="#7c4dff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f47"/>
      <stop offset="100%" stop-color="#030a18"/>
    </linearGradient>

    <!-- the walkway catches the lamps -->
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b4a86" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1c3c" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="lampglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe0b0" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#ffbe6b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffbe6b" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#dce8ff">
    <circle cx="110" cy="62" r="1.8" opacity=".55"/><circle cx="286" cy="38" r="1.3" opacity=".34"/>
    <circle cx="452" cy="112" r="2.0" opacity=".48"/><circle cx="618" cy="58" r="1.4" opacity=".30"/>
    <circle cx="806" cy="96" r="1.7" opacity=".44"/><circle cx="968" cy="44" r="1.3" opacity=".28"/>
    <circle cx="1132" cy="88" r="1.9" opacity=".46"/><circle cx="1318" cy="54" r="1.4" opacity=".30"/>
    <circle cx="1466" cy="110" r="1.7" opacity=".40"/><circle cx="208" cy="172" r="1.3" opacity=".24"/>
    <circle cx="742" cy="178" r="1.5" opacity=".26"/><circle cx="1252" cy="162" r="1.4" opacity=".24"/>
    <circle cx="386" cy="212" r="1.2" opacity=".20"/><circle cx="1046" cy="216" r="1.3" opacity=".22"/>
  </g>

  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant skyline: softened, so it reads as depth rather than detail -->
  <g filter="url(#soften)" fill="#0d2352" opacity=".7">
    <rect x="150" y="404" width="160" height="356"/>
    <rect x="372" y="332" width="200" height="428"/>
    <rect x="628" y="446" width="150" height="314"/>
    <rect x="856" y="368" width="180" height="392"/>
    <rect x="1096" y="422" width="220" height="338"/>
    <rect x="1382" y="386" width="170" height="374"/>
  </g>

  <!-- the campus itself -->
  <g>
    <rect x="-40" y="452" width="196" height="448" fill="#0a1c3e"/>
    <rect x="172" y="548" width="136" height="352" fill="#091935"/>
    <rect x="318" y="356" width="238" height="544" fill="#0c2149"/>
    <rect x="572" y="504" width="156" height="396" fill="#091935"/>
    <rect x="736" y="418" width="216" height="482" fill="#0c2149"/>
    <rect x="968" y="586" width="146" height="314" fill="#091935"/>
    <rect x="1126" y="338" width="258" height="562" fill="#0c2149"/>
    <rect x="1398" y="482" width="186" height="418" fill="#0a1c3e"/>
  </g>

  <!-- rooflines catch the ambient light -->
  <g filter="url(#halo)">
    <rect x="318" y="354" width="238" height="5" fill="#4f7dff" opacity=".7"/>
    <rect x="1126" y="336" width="258" height="5" fill="#4f7dff" opacity=".7"/>
    <rect x="736" y="416" width="216" height="4" fill="#4f7dff" opacity=".55"/>
    <rect x="1398" y="480" width="186" height="4" fill="#4f7dff" opacity=".5"/>
    <rect x="-40" y="450" width="196" height="4" fill="#4f7dff" opacity=".45"/>
  </g>

  <!-- windows: warm and cool, roughly a third lit -->
  <g fill="#ffc978">
    <rect x="334" y="382" width="22" height="14" rx="2" opacity=".92"/><rect x="404" y="382" width="22" height="14" rx="2" opacity=".6"/>
    <rect x="474" y="382" width="22" height="14" rx="2" opacity=".8"/><rect x="334" y="424" width="22" height="14" rx="2" opacity=".55"/>
    <rect x="510" y="424" width="22" height="14" rx="2" opacity=".72"/><rect x="369" y="466" width="22" height="14" rx="2" opacity=".88"/>
    <rect x="440" y="508" width="22" height="14" rx="2" opacity=".6"/><rect x="334" y="550" width="22" height="14" rx="2" opacity=".78"/>
    <rect x="474" y="634" width="22" height="14" rx="2" opacity=".66"/><rect x="404" y="718" width="22" height="14" rx="2" opacity=".5"/>
    <rect x="1142" y="364" width="22" height="14" rx="2" opacity=".9"/><rect x="1212" y="364" width="22" height="14" rx="2" opacity=".62"/>
    <rect x="1352" y="406" width="22" height="14" rx="2" opacity=".82"/><rect x="1282" y="448" width="22" height="14" rx="2" opacity=".58"/>
    <rect x="1142" y="490" width="22" height="14" rx="2" opacity=".74"/><rect x="1352" y="532" width="22" height="14" rx="2" opacity=".6"/>
    <rect x="1212" y="616" width="22" height="14" rx="2" opacity=".68"/><rect x="1282" y="700" width="22" height="14" rx="2" opacity=".52"/>
    <rect x="752" y="446" width="22" height="14" rx="2" opacity=".86"/><rect x="896" y="488" width="22" height="14" rx="2" opacity=".62"/>
    <rect x="824" y="572" width="22" height="14" rx="2" opacity=".7"/><rect x="752" y="656" width="22" height="14" rx="2" opacity=".54"/>
    <rect x="190" y="576" width="22" height="14" rx="2" opacity=".66"/><rect x="258" y="618" width="22" height="14" rx="2" opacity=".5"/>
    <rect x="986" y="612" width="22" height="14" rx="2" opacity=".6"/><rect x="1054" y="696" width="22" height="14" rx="2" opacity=".48"/>
    <rect x="1414" y="510" width="22" height="14" rx="2" opacity=".72"/><rect x="1482" y="594" width="22" height="14" rx="2" opacity=".54"/>
    <rect x="-24" y="480" width="22" height="14" rx="2" opacity=".62"/><rect x="44" y="564" width="22" height="14" rx="2" opacity=".48"/>
  </g>
  <g fill="#6ad4ff">
    <rect x="369" y="382" width="22" height="14" rx="2" opacity=".62"/><rect x="440" y="382" width="22" height="14" rx="2" opacity=".44"/>
    <rect x="510" y="382" width="22" height="14" rx="2" opacity=".52"/><rect x="404" y="424" width="22" height="14" rx="2" opacity=".46"/>
    <rect x="440" y="550" width="22" height="14" rx="2" opacity=".56"/><rect x="510" y="592" width="22" height="14" rx="2" opacity=".42"/>
    <rect x="334" y="676" width="22" height="14" rx="2" opacity=".5"/>
    <rect x="1176" y="406" width="22" height="14" rx="2" opacity=".58"/><rect x="1246" y="364" width="22" height="14" rx="2" opacity=".46"/>
    <rect x="1316" y="448" width="22" height="14" rx="2" opacity=".54"/><rect x="1176" y="532" width="22" height="14" rx="2" opacity=".44"/>
    <rect x="1246" y="574" width="22" height="14" rx="2" opacity=".52"/><rect x="1352" y="658" width="22" height="14" rx="2" opacity=".42"/>
    <rect x="786" y="488" width="22" height="14" rx="2" opacity=".54"/><rect x="860" y="530" width="22" height="14" rx="2" opacity=".44"/>
    <rect x="896" y="614" width="22" height="14" rx="2" opacity=".5"/><rect x="786" y="698" width="22" height="14" rx="2" opacity=".42"/>
    <rect x="224" y="618" width="22" height="14" rx="2" opacity=".5"/><rect x="190" y="702" width="22" height="14" rx="2" opacity=".4"/>
    <rect x="1020" y="654" width="22" height="14" rx="2" opacity=".46"/><rect x="1448" y="552" width="22" height="14" rx="2" opacity=".5"/>
    <rect x="1414" y="636" width="22" height="14" rx="2" opacity=".42"/><rect x="10" y="522" width="22" height="14" rx="2" opacity=".48"/>
    <rect x="78" y="606" width="22" height="14" rx="2" opacity=".4"/>
  </g>

  <!-- lit walkway -->
  <path d="M0 872 L520 792 L1080 792 L1600 872 L1600 900 L0 900 Z" fill="url(#path)"/>

  <!-- street lamps -->
  <g fill="#0a1c3e">
    <rect x="243" y="622" width="6" height="212"/>
    <rect x="536" y="648" width="6" height="186"/>
    <rect x="852" y="608" width="6" height="226"/>
    <rect x="1174" y="634" width="6" height="200"/>
    <rect x="1461" y="654" width="6" height="180"/>
  </g>
  <g fill="#ffe2b4">
    <circle cx="246" cy="618" r="8"/><circle cx="539" cy="644" r="8"/>
    <circle cx="855" cy="604" r="8"/><circle cx="1177" cy="630" r="8"/><circle cx="1464" cy="650" r="8"/>
  </g>
  <g>
    <circle cx="246" cy="618" r="88" fill="url(#lampglow)"/>
    <circle cx="539" cy="644" r="80" fill="url(#lampglow)"/>
    <circle cx="855" cy="604" r="92" fill="url(#lampglow)"/>
    <circle cx="1177" cy="630" r="82" fill="url(#lampglow)"/>
    <circle cx="1464" cy="650" r="76" fill="url(#lampglow)"/>
  </g>

  <!-- treeline -->
  <g fill="#061634">
    <rect x="115" y="782" width="10" height="70"/><circle cx="120" cy="748" r="62"/>
    <rect x="295" y="782" width="10" height="70"/><circle cx="300" cy="730" r="80"/>
    <rect x="515" y="782" width="10" height="70"/><circle cx="520" cy="760" r="54"/>
    <rect x="695" y="782" width="10" height="70"/><circle cx="700" cy="738" r="72"/>
    <rect x="895" y="782" width="10" height="70"/><circle cx="900" cy="754" r="60"/>
    <rect x="1075" y="782" width="10" height="70"/><circle cx="1080" cy="734" r="76"/>
    <rect x="1285" y="782" width="10" height="70"/><circle cx="1290" cy="756" r="58"/>
    <rect x="1475" y="782" width="10" height="70"/><circle cx="1480" cy="742" r="70"/>
  </g>

  <rect x="0" y="862" width="1600" height="38" fill="url(#ground)"/>
</svg>
