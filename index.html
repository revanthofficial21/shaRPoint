<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0b09" />
    <meta
      name="description"
      content="SHARPOINT — an AI-powered student collaboration and academic management platform."
    />

    <!--
      Theme is applied before first paint so there is no flash of the wrong
      colours. Dark is the default; a stored preference wins.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('sharpoint-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.classList.toggle('light', theme === 'light')
          // Accent preset; 'ember' is the base token set, so no rule targets it.
          document.documentElement.setAttribute(
            'data-palette',
            localStorage.getItem('sharpoint-palette') || 'ember',
          )
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-palette', 'ember')
        }
      })()
    </script>

    <title>SHARPOINT</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fdfaf7;
      }
      html.dark,
      html.dark body {
        background: #0e0b09;
      }
      #boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #64748b;
        text-align: center;
        padding: 24px;
      }
      html.dark #boot {
        color: #8b8aa3;
      }
      #boot .title {
        color: #0f172a;
        font-weight: 700;
        font-size: 18px;
      }
      html.dark #boot .title {
        color: #f3f1ee;
      }
      #boot .err {
        max-width: 640px;
        text-align: left;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="title">SHARPOINT</div>
        <div>Loading…</div>
      </div>
    </div>

    <!--
      Safety net: if the app fails to boot for any reason, show the reason on
      screen instead of leaving the user with a blank page.
    -->
    <script>
      ;(function () {
        function show(html) {
          var b = document.getElementById('boot')
          if (!b) return
          b.innerHTML =
            '<div class="title">SHARPOINT failed to start</div>' +
            '<div class="err">' +
            html +
            '</div>'
        }
        window.addEventListener('error', function (e) {
          show('Error: ' + (e.message || 'unknown') + '\nAt: ' + (e.filename || '?') + ':' + (e.lineno || 0))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show('Unhandled promise rejection:\n' + ((r && (r.stack || r.message)) || String(r)))
        })
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
