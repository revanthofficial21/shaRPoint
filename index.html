<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shaRPoint</title>
    <style>
      html, body { margin: 0; background: #04091a; }
      #boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #8a96aa;
        text-align: center;
        padding: 24px;
      }
      #boot .logo { font-size: 40px; }
      #boot .title { color: #e8edf5; font-weight: 800; font-size: 20px; }
      #boot .err {
        max-width: 620px;
        text-align: left;
        background: #1a0f14;
        border: 1px solid #7f1d1d;
        color: #fecaca;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="logo">🎓</div>
        <div class="title">shaRPoint</div>
        <div>Loading…</div>
      </div>
    </div>

    <!--
      Safety net: if the app fails to boot for ANY reason, show the reason on
      screen instead of leaving the user with a blank white page.
    -->
    <script>
      (function () {
        function show(html) {
          var b = document.getElementById("boot");
          if (!b) return; // app already mounted and replaced #root
          b.innerHTML =
            '<div class="logo">🎓</div>' +
            '<div class="title">shaRPoint failed to start</div>' +
            '<div class="err">' + html + '</div>';
        }
        window.addEventListener("error", function (e) {
          show(
            "Error: " + (e.message || "unknown") +
            "\nAt: " + (e.filename || "?") + ":" + (e.lineno || 0)
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("Unhandled promise rejection:\n" + ((r && (r.stack || r.message)) || String(r)));
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
